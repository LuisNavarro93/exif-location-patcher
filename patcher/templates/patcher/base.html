{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EXIF Location Patcher{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'patcher/css/base.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="app-header">
    <a class="app-title" href="{% url 'patcher:landing' %}">EXIF Location Patcher</a>
    {% block header_extra %}{% endblock %}
    <span class="app-version">v{{ str_version }}</span>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
